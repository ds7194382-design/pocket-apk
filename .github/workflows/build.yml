name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unzip project
        run: unzip -q pocket-android.zip -d work

      - name: Build APK
        working-directory: work/pocket-android
        run: gradle --no-daemon assembleDebug

      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp work/pocket-android/app/build/outputs/apk/debug/app-debug.apk PocketAssistant.apk
          gh release create "apk-${{ github.run_number }}" PocketAssistant.apk --title "Pocket Assistant APK (build ${{ github.run_number }})" --notes "Download PocketAssistant.apk and install it on your phone."
